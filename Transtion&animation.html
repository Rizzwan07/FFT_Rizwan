<html>
    <head>
        <title>Transition&Animation</title>
        <style>
            .container{
                display: grid;
                grid-template-columns: repeat(3, 1fr); 
                padding: 20px;
                border: 5px solid #333;
                border-radius: 10px;
                box-shadow: 5px 5px 15px gray;
                width: 1000px;
                height: 700px;
                margin: auto;
                justify-items: center;
                
            }
            button{
                border: none;
                width: 100px;
                height: 50px;
                background-color: red;
                border-radius: 15px;

                transition: 1s;

            }

            button:hover{
                background-color: green;
                transform:scale(1.1);
            }

            .box{
                background: red;
                width: 100px;
                height: 100px;
                /* animation-name: rizz;
                animation-delay: 1s;
                animation-timing-function: ease-in;
                animation-duration: 2s;
                animation-iteration-count: infinite; */

                animation: rizz 1s ease 2s alternate infinite;

            

            }

            @keyframes rizz{
                to{
                    transform: scale(0);
                }
                from{
                    transform: scale(300px);    
                }
            }

            .load{
                width: 100px;
                height: 100px;
                border:5px solid grey;
                border-radius: 50%;
                border-top: 5px solid blue;
                animation: spin 1s ease  infinite ;

            }

            @keyframes spin{
                to{
                    transform:rotate(360deg);
                }

            }

            .square{
                background: rgb(107, 138, 22);
                width: 100px;
                height: 100px;
                animation: change 1s ease 2s alternate infinite;

            }

            @keyframes change{
                from{
                    border-radius: 0%;
                }

                to{
                    border-radius: 50%;
                    background-color: blue;
                }

            }

            .ball{
                width: 100px;
                height: 100px;
                border-radius: 50%;
                border-radius: 50%;
                margin-top: -100px;
                background-color: rgb(243, 245, 124);
                animation: bounce 2s  1s alternate infinite;
            }

            @keyframes bounce{
                from{ transform: translateY(0);
                }
                to{
                    transform: translateY(200px);
                    background-color: rgb(245, 55, 55);
                }
            }

            .triangle {
                width: 100px;
                height: 100px;
                border-bottom-left-radius: 50px;
                background: orange;
                animation: rotate 2s linear infinite;
            }

            @keyframes rotate {
                    from { transform: rotate(0deg); }
                    to   { transform: rotate(360deg); }
                }

            .rectangle{
                width: 200px;
                height: 80px;
                background: rgb(82, 16, 127);
                animation: move 2s linear infinite;
            }
            @keyframes move{
                from{
                    transform:rotate(0deg);
                }
                to{
                    transform: rotate(360deg);
                    background-color: rgb(46, 16, 121);
                }
            }

            .ellipse{
                width: 150px;
                height: 80px;
                border: 5px solid blue;
                background-color: transparent;
                border-radius: 50%;
                animation: elipsemove 2s linear infinite;
            }
            @keyframes elipsemove{
                from{
                    transform: scale(1) rotate(0deg);
                }
                to{
                    transform: scale(1) rotate(360deg);
                    border-color: red;
                }
            }

            .diamond {
                width: 100px;
                height: 100px;
                background: orange;
                animation: spinDiamond 3s linear infinite;
            }

            @keyframes spinDiamond{
                from{
                    transform:rotate3d(1,1,0,0deg);

                }
                to{
                    transform: rotate3d(1,1,0,360deg);
                }
            }


            
        </style>
    </head>
    <body>
        <div class="container">
            <button >Action</button>
            <div class="box"></div>
            <div class="load"> </div>
            <div class="square"></div>
            <div class="ball"></div>
            <div class="triangle"></div>
            <div class="rectangle"></div>
            <div class="ellipse"></div>
            <div class="diamond"></div>
        </div>

        

    </body>
</html>
