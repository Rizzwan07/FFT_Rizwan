<html>
    <head>
        <title>Transition&Animation</title>
        <style>
            button{
                margin-left: 650px;
                margin-top: 300px;
                border: none;
                width: 100px;
                height: 50px;
                background-color: red;
                border-radius: 15px;

                transition: 1s;

            }

            button:hover{
                background-color: green;
                transform:scale(1.1);
            }

            .box{
                background: red;
                width: 100px;
                height: 100px;
                /* animation-name: rizz;
                animation-delay: 1s;
                animation-timing-function: ease-in;
                animation-duration: 2s;
                animation-iteration-count: infinite; */

                animation: rizz 1s ease 2s alternate infinite;

            

            }

            @keyframes rizz{
                to{
                    transform: scale(0);
                }
                form{
                    transform: scale(300px);    
                }
            }

            .load{
                width: 100px;
                height: 100px;
                border:5px solid grey;
                border-radius: 50%;
                border-top: 5px solid blue;
                animation: spin 1s ease  infinite ;

            }

            @keyframes spin{
                to{
                    transform:rotate(360deg);
                }

            }

            .square{
                background: rgb(107, 138, 22);
                width: 100px;
                height: 100px;
                margin-left: 300px;
                animation: change 1s ease 2s alternate infinite;

            }

            @keyframes change{
                from{
                    border-radius: 0%;
                }

                to{
                    border-radius: 50%;
                    background-color: blue;
                }

            }

            .ball{
                margin-left: 300px;
                width: 100px;
                height: 100px;
                border-radius: 50%;
                border-radius: 50%;
                background-color: rgb(243, 245, 124);
                animation: bounce 2s  1s alternate infinite;
            }

            @keyframes bounce{
                from{ transform: translateY(0);
                }
                to{
                    transform: translateY(200px);
                    background-color: rgb(245, 55, 55);
                }
            }

            .triangle {
                margin-left: 600px;
                width: 100px;
                height: 100px;
                border-bottom-left-radius: 50px;
                background: orange;
                animation: rotate 2s linear infinite;
            }

            @keyframes rotate {
                    from { transform: rotate(0deg); }
                    to   { transform: rotate(360deg); }
                }

            .rectangle{
                margin-left: 800px;
                width: 200px;
                height: 80px;
                background: rgb(82, 16, 127);
                animation: move 2s linear infinite;
            }
            @keyframes move{
                from{
                    transform:rotate(0deg);
                }
                to{
                    transform: rotate(360deg);
                    background-color: rgb(46, 16, 121);
                }
            }

            .ellipse{
                margin-left: 1000px;
                width: 150px;
                height: 80px;
                border: 5px solid blue;
                background-color: transparent;
                border-radius: 50%;
                animation: elipsemove 2s linear infinite;
            }
            @keyframes elipsemove{
                from{
                    transform: scale(1) rotate(0deg);
                }
                to{
                    transform: scale(1) rotate(360deg);
                    border-color: red;
                }
            }

            .diamond {
                width: 100px;
                height: 100px;
                background: orange;
                transform: rotate(45deg);   
                margin-left: 500px;
                animation: spinDiamond 3s linear infinite;
            }

            @keyframes spinDiamond{
                from{
                    transform:rotate3d(1,1,0,0deg);

                }
                to{
                    transform: rotate3d(1,1,0,360deg);
                }
            }


            
        </style>
    </head>
    <body>
        <button >Action</button>
        <div class="box"></div>
        <br><br>
        <div class="load"> </div>
        <br><br>
        <div class="square"></div>
        <br><br>
        <div class="ball"></div>
        <br><br>
        <div class="triangle"></div>
        <br><br>
        <div class="rectangle"></div>
        <br><br>
        <div class="ellipse"></div>
        <br><br>
        <div class="diamond"></div>

        

    </body>
</html>
